packages:
  - "apps/*"
minimumReleaseAgeExclude:
  # @fsarch/server is only published to GitHub Packages, not the public npm
  # registry - pnpm's minimumReleaseAge check can't find its manifest there
  # to verify a publish date, so it fails closed. Excluded by bare name (all
  # versions, not just the one currently pinned) so future bumps don't need
  # a matching pnpm-workspace.yaml edit every time. Same remedy as the
  # michael-braun/image-server repo uses for its own unresolvable entries.
  - '@fsarch/server'
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  better-sqlite3: true
  protobufjs: true
  nx: true
