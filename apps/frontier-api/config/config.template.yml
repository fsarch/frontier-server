uac:
  type: 'static'
  users:
    - user_id: 'abcdef'
      permissions:
        - manage

auth:
  type: 'jwt-jwk'
  jwkUrl: ''

database:
  type: cockroachdb
  host: localhost
  username: postgres
  password: 'postgres'
  database: dev_frontier-server
  ssl:
    rejectUnauthorized: false
    ca:
      path: ./config/certs/ca.crt

workers:
  websocket:
    auth_token: 'change-me'
    config_check_interval_ms: 2000

# OpenTelemetry tracing (@fsarch/server built-in, no code changes needed).
# Off by default; flip `enabled: true` and point `exporter` at a real
# collector (otlp-http/otlp-grpc) or use `console` for local debugging.
# tracing:
#   enabled: true
#   serviceName: frontier-api
#   sampleRatio: 1.0
#   exporter:
#     type: otlp-http
#     url: http://localhost:4318/v1/traces
#     headers:
#       Authorization: 'Bearer secret'

remote-events:
  type: static
  hosts:
    - 127.0.0.1:8080
    - 127.0.0.1:3000

function_server:
  type: 'remote'
  url: 'http://127.0.0.1:8081'
  auth:
    type: 'openid-client-credentials'
    token_endpoint: ''
    client_id: ''
    client_secret: ''

function_worker:
  type: 'remote'
  url: 'http://127.0.0.1:8082'
  auth:
    type: 'openid-client-credentials'
    token_endpoint: ''
    client_id: ''
    client_secret: ''
