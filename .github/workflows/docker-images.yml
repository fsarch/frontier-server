name: Build and Publish Docker Images

# Two ways in:
# - workflow_run: today's behavior - build/push a floating `:latest` image
#   per app after "CI - Tests" passes on `main`. Only fires for pushes to
#   main (test.yml doesn't listen to tags), so this path never sees a tag
#   ref and always falls into the `:latest` branch below.
# - push (tags: v*): stable release builds, mirroring every other fsarch
#   app repo's image.yml - versioned + :stable tags, then a
#   repository_dispatch to helm-charts so bump-chart.yaml can pick it up.
#   Deliberately NOT gated on CI - tag pushes aren't covered by test.yml's
#   triggers either, same as everywhere else in this org.
on:
  workflow_run:
    workflows: ["CI - Tests"]
    types:
      - completed
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        include:
          # `image` is the published Docker image / helm-charts chart name,
          # deliberately decoupled from the app's own directory name -
          # apps/frontier-api publishes as fsarch/frontier-server to match
          # the monorepo's own name (see charts/frontier-server in
          # fsarch/helm-charts for why).
          - image: frontier-server
            dockerfile: apps/frontier-api/Dockerfile
          - image: frontier-worker
            dockerfile: apps/frontier-worker/Dockerfile

    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          # For workflow_run, build the exact commit that passed CI rather
          # than whatever HEAD of main happens to be by the time this runs.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: determine image tags
        id: image
        env:
          IMAGE: fsarch/${{ matrix.image }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${IMAGE}:${VERSION}"
            # only mark proper releases (no prerelease suffix, e.g. -beta.0) as stable
            if [[ "${VERSION}" != *-* ]]; then
              TAGS="${TAGS} ${IMAGE}:stable"
              echo "stable=true" >> "$GITHUB_OUTPUT"
            else
              echo "stable=false" >> "$GITHUB_OUTPUT"
            fi
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            TAGS="${IMAGE}:latest"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}

      - name: notify helm-charts of the new release
        # success() is required here because a custom `if:` replaces the
        # step's implicit default (only run on success) - without it, this
        # would still fire even if the build/push step failed and neither
        # the version nor the :stable tag actually got pushed.
        # Only for proper releases (tags without a prerelease suffix), so
        # betas etc. don't bump the published chart.
        if: success() && steps.image.outputs.stable == 'true'
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.HELM_CHARTS_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/fsarch/helm-charts/dispatches \
            -d '{"event_type":"${{ matrix.image }}-released","client_payload":{"version":"${{ steps.image.outputs.version }}"}}'
