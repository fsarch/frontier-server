name: Build and Publish Docker Images

# Single way in: workflow_run, fired after "CI - Tests" completes. test.yml
# listens to both `main` pushes and `v*` tag pushes, so every image build -
# floating `:latest` as well as versioned/`:stable` releases - only happens
# once the corresponding commit has actually passed CI. Mirrors dashboard's
# image.yml, which is the only other fsarch repo gating tag releases on CI
# this way; every other repo's image.yml builds straight off `push` with no
# CI gate at all.
on:
  workflow_run:
    workflows: ["CI - Tests"]
    types:
      - completed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # For workflow_run events triggered by a tag push, head_branch holds the
    # tag name (e.g. "v1.2.3"), not a branch - so this also has to accept
    # that, not just "main".
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'main' ||
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      }}
    strategy:
      matrix:
        include:
          # `image` is the published Docker image / helm-charts chart name,
          # deliberately decoupled from the app's own directory name -
          # apps/frontier-api publishes as fsarch/frontier-server to match
          # the monorepo's own name (see charts/frontier-server in
          # fsarch/helm-charts for why).
          - image: frontier-server
            dockerfile: apps/frontier-api/Dockerfile
          - image: frontier-worker
            dockerfile: apps/frontier-worker/Dockerfile

    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          # Build the exact commit that passed CI rather than whatever HEAD
          # of the branch/tag happens to be by the time this runs.
          ref: ${{ github.event.workflow_run.head_sha }}

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: determine image tags
        id: image
        env:
          IMAGE: fsarch/${{ matrix.image }}
          # For workflow_run events, GITHUB_REF always reflects this workflow
          # file's own ref (the default branch), not the ref that triggered
          # the upstream "CI - Tests" run - so it can't be used to detect a
          # tag push here. Use the workflow_run payload instead, which holds
          # the tag name (without the "refs/tags/" prefix) in head_branch
          # when the trigger was a tag push.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ "${HEAD_BRANCH}" == v* ]]; then
            VERSION="${HEAD_BRANCH#v}"
            TAGS="${IMAGE}:${VERSION}"
            # only mark proper releases (no prerelease suffix, e.g. -beta.0) as stable
            if [[ "${VERSION}" != *-* ]]; then
              TAGS="${TAGS} ${IMAGE}:stable"
              echo "stable=true" >> "$GITHUB_OUTPUT"
            else
              echo "stable=false" >> "$GITHUB_OUTPUT"
            fi
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            TAGS="${IMAGE}:latest"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        run: |
          TAG_ARGS=""
          for tag in ${{ steps.image.outputs.tags }}; do
            TAG_ARGS="${TAG_ARGS} --tag ${tag}"
          done

          docker buildx build \
            ${TAG_ARGS} \
            --file ${{ matrix.dockerfile }} \
            --platform linux/amd64,linux/arm64 \
            --push .

      - name: notify helm-charts of the new release
        # success() is required here because a custom `if:` replaces the
        # step's implicit default (only run on success) - without it, this
        # would still fire even if the build/push step failed and neither
        # the version nor the :stable tag actually got pushed.
        # Only for proper releases (tags without a prerelease suffix), so
        # betas etc. don't bump the published chart.
        if: success() && steps.image.outputs.stable == 'true'
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.HELM_CHARTS_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/fsarch/helm-charts/dispatches \
            -d '{"event_type":"${{ matrix.image }}-released","client_payload":{"version":"${{ steps.image.outputs.version }}"}}'
