name: CI - Tests

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontier-api
            workspace: apps/frontier-api
          - name: frontier-worker
            workspace: apps/frontier-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests for {{ matrix.name }}
        run: pnpm --filter ./${{ matrix.workspace }} run test
        env:
          CI: true
